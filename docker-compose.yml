# Pinned so every checkout and worktree shares one Postgres container instead
# of each trying to start its own on the same port. Parallel work isolates by
# database instead (PG_DB, see e2e/README.md).
name: malleable-plc-poc

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: malleable_pls
      POSTGRES_USER: pls
      POSTGRES_PASSWORD: pls
    ports:
      - "127.0.0.1:${PG_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pls -d malleable_pls"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
