<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Malleable PLS</title>
    <script>try{var t=localStorage.getItem('pls-theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}</script>
    <!-- The first screen's font (src/fonts/fonts.css), fetched with the page rather than once the CSS asks for it. -->
    <link rel="preload" href="/src/fonts/dm-sans-latin-opsz-normal.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body class="h-dvh overflow-hidden antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
